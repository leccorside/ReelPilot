# Production override. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# The reverse proxy with HTTPS (Caddy), backups and the registry come in Passo 19.
services:
  web:
    build:
      target: runner-web
    image: reelpilot-web:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      # Fixed public address for Auth.js URLs (ignores Host/X-Forwarded-Host headers).
      AUTH_URL: ${APP_URL}/api/auth
      AUTH_RATE_LIMIT_SCALE: "1"
      WATCHPACK_POLLING: !reset null
      CHOKIDAR_USEPOLLING: !reset null
    volumes: !reset []
    restart: unless-stopped
    healthcheck:
      start_period: 30s

  worker:
    build:
      target: runner-worker
    image: reelpilot-worker:${IMAGE_TAG:-local}
    command: !reset null
    environment:
      NODE_ENV: production
      CHOKIDAR_USEPOLLING: !reset null
      FAKE_PROVIDER_DELAY_MS: "0"
    volumes: !reset
      - worker-tmp:/tmp/reelpilot
    restart: unless-stopped

  migrate:
    build:
      target: runner-migrate
    image: reelpilot-migrate:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
    volumes: !reset []

  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  s3:
    restart: unless-stopped

  # No fake mail server in production (a real SMTP/Resend comes in Passo 16).
  mailpit:
    profiles: ["dev-only"]
