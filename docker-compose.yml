# Development environment: everything runs in containers.
#   docker compose up -d          -> web (hot reload, http://localhost:3100), postgres, redis, s3 (SeaweedFS), mailpit
#   docker compose --profile test run --rm e2e   -> Playwright end-to-end tests
# Shortcuts: scripts/dc.ps1 (up, down, logs, test, e2e, lint, typecheck, shell, prod-build...)
name: reelpilot

x-app-env: &app-env
  APP_URL: ${APP_URL:-http://localhost:3100}
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://s3:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: ${MAIL_FROM:-ReelPilot <no-reply@localhost>}

services:
  web:
    build:
      context: .
      target: dev
    environment:
      <<: *app-env
      # Bind mounts from Windows don't emit file events inside the container: poll instead.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-3100}:3000"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health/"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 5

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.51
    entrypoint: ["/bin/sh", "/seaweed-entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/seaweedfs/entrypoint.sh:/seaweed-entrypoint.sh:ro
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30

  # Creates the bucket (idempotent) and exits.
  s3-init:
    image: amazon/aws-cli:2.39.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "${S3_BUCKET}" 2>/dev/null
        || aws --endpoint-url http://s3:8333 s3 mb "s3://${S3_BUCKET}"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      s3:
        condition: service_healthy

  # Catches every e-mail sent in development. Web UI: http://localhost:8125
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "${MAILPIT_PORT:-8125}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # End-to-end tests against the running web service (only with --profile test).
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["test"]
    working_dir: /app
    environment:
      E2E_BASE_URL: http://web:3000
      CI: "true"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    ipc: host
    command: ["npx", "playwright", "test"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  web-node-modules:
  web-next:
  pg-data:
  redis-data:
  s3-data:
